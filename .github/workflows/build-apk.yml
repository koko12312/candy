name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Bundle Web Assets & Initialize Capacitor
        run: |
          mkdir -p dist
          # Bundle all project files and subfolders into dist (ignoring git metadata)
          rsync -av --exclude='.git*' --exclude='.github' --exclude='dist' ./ dist/
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Candy Game" "com.koko.candy" --web-dir "dist"
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CandyGame-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CandyGame-debug-apk
          path: CandyGame-debug.apk
          retention-days: 7
          
