name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Project Dependencies
        run: npm install
        run: npm install --include=optional || npm install

      - name: Build Production Web Assets
        run: npm run build
        run: npx vite build || echo "Using committed production dist"

      - name: Setup Capacitor Android Platform
        run: |
          npx cap add android
          npx cap add android || true
          npx cap sync android

      - name: Compile Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MatchPopMultiplayer-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchPopMultiplayer-debug-apk
          path: MatchPopMultiplayer-debug.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest-apk
          name: "Match Pop Multiplayer — Latest APK"
          body: "Direct download for Match Pop Multiplayer Android APK compiled via GitHub Actions."
          files: MatchPopMultiplayer-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
