name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Project Dependencies
        run: npm install --include=optional || npm install

      - name: Build Production Web Assets
        run: npx vite build || echo "Using committed production dist"

      - name: Setup Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Update Android Version and VersionCode
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const gradlePath = "android/app/build.gradle";
            if (fs.existsSync(gradlePath)) {
              let content = fs.readFileSync(gradlePath, "utf8");
              const runNumber = parseInt(process.env.GITHUB_RUN_NUMBER || "1", 10);
              // Ensure versionCode increments with each run and matches version string
              content = content.replace(/versionCode \d+/g, "versionCode " + (1000 + runNumber));
              content = content.replace(/versionName "[^"]+"/g, "versionName \"" + pkg.version + "\"");
              fs.writeFileSync(gradlePath, content, "utf8");
              console.log("[CI] Configured Android versionCode: " + (1000 + runNumber) + ", versionName: " + pkg.version);
            }
          '

      - name: Generate App Icons and Splash Screens
        run: npx @capacitor/assets generate --android || true

      - name: Ensure Permanent Keystore Exists
        run: |
          KEYSTORE_PATH="android/app/matchpop-debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "[CI] Generating permanent keystore at $KEYSTORE_PATH"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias matchpop \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass matchpop123 \
              -keypass matchpop123 \
              -dname "CN=MatchPop, OU=Gaming, O=MatchPop, L=City, S=State, C=US"
          fi

      - name: Compile Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MatchPopMultiplayer-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchPopMultiplayer-debug-apk
          path: MatchPopMultiplayer-debug.apk
          retention-days: 7

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: "Match Pop Multiplayer ${{ steps.get_version.outputs.version }}"
          body: |
            ## Match Pop Multiplayer ${{ steps.get_version.outputs.version }}
            
            Download the Android APK below to install the game:
            - **[Download MatchPopMultiplayer-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/MatchPopMultiplayer-debug.apk)**
          files: |
            MatchPopMultiplayer-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
