<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Match Pop Multiplayer</title>
  <meta name="description" content="Real-time 1-4 Player Multiplayer Candy Match-3 on a Shared Board" />
  <meta name="theme-color" content="#18042c" />
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);

      --bg-dark: #18042c;
      --bg-surface: #260946;
      --bg-card: rgba(58, 18, 97, 0.75);
      --accent-pink: #ff2d87;
      --accent-yellow: #ffd000;
      --accent-blue: #00d4ff;
      --accent-green: #00e676;
      --accent-purple: #aa00ff;
      --text-main: #ffffff;
      --text-muted: #d1b8eb;
      --font-family: 'Fredoka', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #310857 0%, #18042c 100%);
      font-family: var(--font-family);
      color: var(--text-main);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Screen Views */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      overflow: hidden;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .hidden,
    .screen.hidden {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Common Buttons & Inputs */
    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
      font-weight: 700;
      border-radius: 999px;
      transition: transform 0.1s ease, filter 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-primary {
      background: linear-gradient(180deg, #ff4097 0%, #d80062 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 45, 135, 0.45), 0 2px 0 #8f0041;
      padding: 14px 28px;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .btn-secondary {
      background: linear-gradient(180deg, #38d39f 0%, #159c6b 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(21, 156, 107, 0.4), 0 2px 0 #0f6c4a;
      padding: 12px 24px;
      font-size: 1rem;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px 20px;
      font-size: 0.95rem;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    input[type="text"] {
      font-family: inherit;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: white;
      padding: 12px 16px;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-pink);
    }

    /* ---------------------------------------------------- */
    /* LOBBY VIEW */
    /* ---------------------------------------------------- */
    #lobby-screen {
      overflow-y: auto;
      padding: calc(20px + var(--sat)) calc(16px + var(--sar)) calc(24px + max(var(--sab), 24px)) calc(16px + var(--sal));
      justify-content: flex-start;
      z-index: 10;
    }

    .lobby-header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 24px;
    }

    .game-logo {
      font-size: 2.4rem;
      font-weight: 900;
      background: linear-gradient(180deg, #ffd000 0%, #ff4097 50%, #aa00ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(255, 45, 135, 0.5);
      margin: 0;
      letter-spacing: -0.5px;
    }

    .game-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 4px 0 0 0;
      font-weight: 500;
    }

    .lobby-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
    }

    .avatar-grid {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 12px 0 16px 0;
    }

    .avatar-option {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }

    .avatar-option.selected {
      border-color: var(--accent-yellow);
      transform: scale(1.15);
      background: rgba(255, 208, 0, 0.2);
    }

    .rooms-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 10px;
    }

    .room-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.06);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Waiting Room View Inside Lobby */
    .waiting-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .slot-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slot-card.occupied {
      background: rgba(170, 0, 255, 0.2);
      border-color: rgba(255, 45, 135, 0.4);
    }

    .slot-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .badge-ready {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-green);
      color: #003310;
      font-weight: 700;
    }

    .badge-waiting {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
    }

    /* ---------------------------------------------------- */
    /* IN-GAME VIEW */
    /* ---------------------------------------------------- */
    #game-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      z-index: 5;
      box-sizing: border-box;
      overflow: hidden;
    }

    .game-top-bar {
      flex-shrink: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(8px + var(--sat)) calc(16px + var(--sar)) 8px calc(16px + var(--sal));
      background: rgba(24, 4, 44, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .room-badge {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .timer-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer-ring-wrapper {
      position: relative;
      width: 38px;
      height: 38px;
    }

    .timer-ring-wrapper svg {
      transform: rotate(-90deg);
    }

    .timer-number {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .timer-critical {
      color: #ff1744 !important;
      animation: pulseAlert 0.5s infinite alternate;
    }

    @keyframes pulseAlert {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    .turn-status-banner {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      letter-spacing: 0.3px;
    }

    .turn-status-banner.my-turn {
      background: linear-gradient(90deg, #ff007f 0%, #aa00ff 100%);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
      animation: bannerGlow 1.2s infinite alternate;
    }

    @keyframes bannerGlow {
      from { box-shadow: 0 0 8px rgba(255, 0, 127, 0.4); }
      to { box-shadow: 0 0 20px rgba(255, 0, 127, 0.9); }
    }

    /* Center Canvas Area */
    .canvas-container {
      position: relative;
      flex: 1 1 0%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      overflow: hidden;
    }

    canvas.game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      touch-action: none;
    }

    #bg-canvas {
      z-index: 1;
    }

    #interactive-canvas {
      z-index: 2;
    }

    /* Bottom HUD - Players */
    .game-bottom-bar {
      flex-shrink: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px calc(12px + var(--sar)) calc(10px + max(var(--sab), 26px)) calc(12px + var(--sal));
      background: rgba(24, 4, 44, 0.92);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 20;
    }

    .players-strip {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 540px;
      justify-content: space-around;
    }

    .player-pill {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid transparent;
      padding: 6px 10px;
      border-radius: 12px;
      transition: all 0.2s ease;
      min-width: 0;
    }

    .player-pill.active {
      background: rgba(255, 215, 0, 0.18);
      border-color: var(--accent-yellow);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
      transform: translateY(-2px);
    }

    .player-pill.disconnected {
      opacity: 0.45;
      filter: grayscale(0.8);
    }

    .pill-avatar {
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .pill-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .pill-name {
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-score {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    /* ---------------------------------------------------- */
    /* GAME OVER PODIUM MODAL */
    /* ---------------------------------------------------- */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 2, 30, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .podium-card {
      background: linear-gradient(180deg, #3d1469 0%, #1d0736 100%);
      border: 2px solid rgba(255, 215, 0, 0.4);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .podium-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }

    .podium-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
    }

    .podium-entry.winner {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.25) 0%, rgba(255, 45, 135, 0.2) 100%);
      border: 1px solid var(--accent-yellow);
    }

    /* Responsive Landscape overrides */
    @media (orientation: landscape) and (min-height: 480px) {
      #game-screen {
        flex-direction: row;
      }
      .game-top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50px;
      }
      .canvas-container {
        padding-top: 50px;
        flex: 1;
        height: 100%;
        box-sizing: border-box;
      }
      .game-bottom-bar {
        width: 220px;
        height: calc(100% - 50px);
        margin-top: 50px;
        border-top: none;
        border-left: 1px solid rgba(255, 255, 255, 0.1);
      }
      .players-strip {
        flex-direction: column;
        height: 100%;
        justify-content: flex-start;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-DumOqwsb.js"></script>
</head>
<body>
  <div id="app">
    <!-- Screen: Lobby -->
    <div id="lobby-screen" class="screen">
      <div class="lobby-header">
        <h1 class="game-logo">MATCH POP</h1>
        <p class="game-subtitle">Real-time 1-4 Player Multiplayer <span id="app-version" style="font-size: 0.75rem; opacity: 0.7; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 6px; margin-left: 6px;">v1.0.0</span></p>
      </div>

      <!-- Step 1: Profile & Join/Create -->
      <div id="lobby-main-card" class="lobby-card">
        <div style="margin-bottom: 14px;">
          <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">YOUR CANDY ALIAS</label>
          <input type="text" id="player-name-input" placeholder="SweetCrusher" maxlength="15" style="width: 100%; margin-top: 6px;" />
        </div>

        <div>
          <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">SELECT AVATAR</label>
          <div class="avatar-grid" id="avatar-selector">
            <div class="avatar-option selected" data-avatar="avatar_1">🍬</div>
            <div class="avatar-option" data-avatar="avatar_2">🍭</div>
            <div class="avatar-option" data-avatar="avatar_3">🍫</div>
            <div class="avatar-option" data-avatar="avatar_4">🍩</div>
            <div class="avatar-option" data-avatar="avatar_5">🧁</div>
            <div class="avatar-option" data-avatar="avatar_6">🍪</div>
          </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 18px;">
          <button id="btn-create-room" class="btn-primary" style="flex: 1;">Create Room</button>
          <button id="btn-join-room-prompt" class="btn-secondary" style="flex: 1;">Join Room</button>
        </div>

        <!-- Join Room Form (Toggleable) -->
        <div id="join-form-row" style="display: none; margin-top: 14px; gap: 8px;">
          <input type="text" id="room-code-input" placeholder="CODE (e.g. JELLY)" maxlength="6" style="flex: 1; text-transform: uppercase;" />
          <button id="btn-submit-join" class="btn-secondary" style="padding: 12px 18px;">Join</button>
        </div>

        <!-- Public Rooms Section -->
        <div style="margin-top: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">PUBLIC LOBBIES</label>
            <button id="btn-refresh-rooms" style="background: transparent; color: var(--accent-blue); font-size: 0.8rem; padding: 4px;">↻ Refresh</button>
          </div>
          <div class="rooms-list" id="public-rooms-list">
            <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 12px;">No active public rooms found. Create one!</div>
          </div>
        </div>
      </div>

      <!-- Step 2: Room Lobby (Inside Waiting Room) -->
      <div id="lobby-waiting-card" class="lobby-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">ROOM CODE</div>
            <div id="waiting-room-code" style="font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; color: var(--accent-yellow);">-----</div>
          </div>
          <button id="btn-copy-code" class="btn-outline" style="padding: 6px 14px; font-size: 0.85rem;">Copy Link</button>
        </div>

        <div class="waiting-slots" id="waiting-slots-container">
          <!-- 4 slot cards injected by LobbyUI -->
        </div>

        <div style="display: flex; gap: 10px; margin-top: 16px;">
          <button id="btn-toggle-ready" class="btn-secondary" style="flex: 1;">Ready Up</button>
          <button id="btn-start-game" class="btn-primary" style="flex: 1;" disabled>Start Game</button>
        </div>

        <div style="margin-top: 12px; text-align: center;">
          <button id="btn-leave-room" class="btn-outline" style="font-size: 0.85rem; padding: 6px 16px;">Leave Room</button>
        </div>
      </div>
    </div>

    <!-- Screen: In-Game -->
    <div id="game-screen" class="screen hidden">
      <!-- Top HUD -->
      <div class="game-top-bar">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="room-badge" id="hud-room-code">ROOM</span>
          <button id="btn-sound-toggle" class="btn-icon" title="Toggle SFX">🔊</button>
          <button id="btn-music-toggle" class="btn-icon" title="Toggle Music">🎵</button>
          <button id="btn-exit-game" class="btn-icon" title="Quit Game" style="background: rgba(255, 50, 80, 0.5);">❌</button>
        </div>

        <!-- Turn Timer Ring -->
        <div class="timer-container">
          <div class="timer-ring-wrapper">
            <svg width="38" height="38" viewBox="0 0 38 38">
              <circle cx="19" cy="19" r="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3.5" />
              <circle id="timer-ring-progress" cx="19" cy="19" r="16" fill="none" stroke="#ffd000" stroke-width="3.5" stroke-dasharray="100.5" stroke-dashoffset="0" stroke-linecap="round" />
            </svg>
            <div id="timer-number-display" class="timer-number">20</div>
          </div>
        </div>

        <!-- Active Player Turn Indicator -->
        <div id="turn-banner" class="turn-status-banner">Waiting...</div>
      </div>

      <!-- Center Board Layer -->
      <div class="canvas-container" id="canvas-wrapper">
        <canvas id="bg-canvas" class="game-canvas"></canvas>
        <canvas id="interactive-canvas" class="game-canvas"></canvas>
      </div>

      <!-- Bottom HUD: 4 Player cards -->
      <div class="game-bottom-bar">
        <div class="players-strip" id="hud-players-strip">
          <!-- 4 player pills dynamically rendered -->
        </div>
      </div>
    </div>

    <!-- Modal: Game Over Podium -->
    <div id="game-over-modal" class="modal-overlay hidden">
      <div class="podium-card">
        <h2 style="font-size: 2rem; font-weight: 900; margin: 0 0 6px 0; color: var(--accent-yellow);">MATCH COMPLETE!</h2>
        <p style="color: var(--text-muted); margin: 0 0 18px 0; font-size: 0.95rem;">Final Player Standings</p>
        <div class="podium-list" id="podium-entries">
          <!-- Populated dynamically -->
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button id="btn-podium-lobby" class="btn-primary" style="flex: 1;">Return to Waiting Room</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
